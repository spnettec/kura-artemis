name=简单MQTT代理
description=一个基于Apache ActiveMQ Artemis的简单MQTT代理实例
enabled=启用
enabledDesc=启用代理实例
address=MQTT地址
addressDesc=MQTT代理侦听传入连接的地址。 确保检查防火墙是否配置正确以允许访问该地址。
port=MQTT端口
portDesc=MQTT代理的端口。 确保检查防火墙是否配置正确以允许访问此端口。
user=用户名
userDesc=访问代理所需的用户名
password=用户密码
passwordDesc=连接所需的密码。 如果密码为空，则无需密码即可连接。
